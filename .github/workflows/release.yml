name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bundle RustIDE.app
        run: ./scripts/bundle.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/RustIDE.zip \
            --title "RustIDE $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Ad-hoc signed build: the first time, right-click RustIDE.app and choose Open (or run: xattr -dr com.apple.quarantine RustIDE.app). Requires macOS 14+ and a Rust toolchain (rustup) with rust-analyzer."
