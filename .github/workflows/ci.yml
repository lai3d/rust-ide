name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # version number from git describe

      - name: Rust toolchain + rust-analyzer
        run: |
          rustup toolchain install stable --profile minimal --component rust-analyzer,rustfmt,rust-src,clippy,llvm-tools-preview
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo-llvm-cov (Test with Coverage)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Allow debugging (lldb-dap)
        run: sudo DevToolsSecurity -enable || true

      - name: Toolchain
        run: |
          swift --version
          cargo --version
          rust-analyzer --version
          cargo llvm-cov --version
          xcrun -f lldb-dap

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle RustIDE.app
        run: ./scripts/bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: RustIDE-app
          path: build/RustIDE.zip
